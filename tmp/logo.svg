<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="purpleBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a1470"/>
      <stop offset="70%" stop-color="#460d57"/>
      <stop offset="100%" stop-color="#350843"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="flowerCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="40%" stop-color="#ffcc00"/>
      <stop offset="70%" stop-color="#fff2a1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>
    <linearGradient id="petalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="256" cy="256" r="250" fill="url(#purpleBg)"/>

  <!-- Subtle watermark script characters in background -->
  <g fill="#ffffff" opacity="0.05" font-family="sans-serif" font-weight="bold" font-size="52">
    <text x="60" y="120">ก</text>
    <text x="140" y="90">ข</text>
    <text x="240" y="80">ค</text>
    <text x="350" y="100">ง</text>
    <text x="430" y="160">จ</text>
    <text x="70" y="220">ฉ</text>
    <text x="420" y="270">ช</text>
    <text x="80" y="340">ซ</text>
    <text x="430" y="370">ญ</text>
    <text x="120" y="440">ด</text>
    <text x="230" y="460">ต</text>
    <text x="340" y="440">ถ</text>
  </g>

  <!-- Yellow Stylized Script Text in Center -->
  <g fill="#ffea00" stroke="#ffea00" stroke-linejoin="round" stroke-linecap="round">
    <!-- Letter 1 (left): Thukha / rounded curve with center loop and lower hook -->
    <!-- Outer loop -->
    <path d="M 85 270 C 80 230, 110 205, 145 205 C 175 205, 195 225, 200 250 C 205 275, 190 300, 160 305 C 130 310, 105 295, 105 270 C 105 245, 125 230, 145 230 C 160 230, 172 240, 170 255 C 168 268, 155 278, 142 276 C 132 274, 126 266, 126 258" fill="none" stroke-width="26"/>
    <!-- Lower hook/tail under letter 1 -->
    <path d="M 132 305 L 132 355 C 132 368, 142 375, 158 370 C 165 367, 168 360, 165 352 C 162 346, 152 350, 148 354" fill="none" stroke-width="20"/>

    <!-- Letter 2: curving round body with upward sweeping flame tail -->
    <path d="M 215 285 C 205 260, 215 225, 240 215 C 265 205, 285 225, 280 255 C 275 285, 250 305, 225 295 C 208 288, 202 270, 210 255 C 218 240, 238 238, 248 248 C 255 255, 252 268, 242 270" fill="none" stroke-width="22"/>
    <!-- Sweeping tall flame flourish rising from letter 2 -->
    <path d="M 265 220 C 270 180, 275 155, 262 145 C 255 140, 260 148, 268 152 C 285 160, 290 190, 285 225" fill="#ffea00" stroke-width="12"/>

    <!-- Letter 3: rounded loop (va) -->
    <path d="M 305 255 C 300 230, 320 215, 345 215 C 370 215, 385 235, 380 260 C 375 285, 355 305, 330 305 C 310 305, 298 290, 302 270 C 305 255, 320 245, 335 248 C 348 250, 352 262, 348 272" fill="none" stroke-width="22"/>

    <!-- Letter 4: rounded loop with hook (ti) -->
    <path d="M 395 255 C 390 230, 410 215, 435 215 C 460 215, 478 235, 475 260 C 472 285, 452 305, 428 305 C 408 305, 395 290, 400 270 C 405 252, 422 245, 436 248 C 448 250, 452 265, 445 275 C 440 282, 430 282, 426 275" fill="none" stroke-width="22"/>
  </g>

  <!-- Realistic White Frangipani / Plumeria Flower on top-left of letter 1 -->
  <g transform="translate(142, 190) scale(0.68)" filter="url(#shadow)">
    <!-- 5 overlapping petals -->
    <g transform="rotate(0)">
      <path d="M 0 0 C -25 -20, -35 -60, -15 -90 C 5 -110, 40 -95, 45 -65 C 50 -35, 25 -10, 0 0 Z" fill="url(#petalGrad)"/>
    </g>
    <g transform="rotate(72)">
      <path d="M 0 0 C -25 -20, -35 -60, -15 -90 C 5 -110, 40 -95, 45 -65 C 50 -35, 25 -10, 0 0 Z" fill="url(#petalGrad)"/>
    </g>
    <g transform="rotate(144)">
      <path d="M 0 0 C -25 -20, -35 -60, -15 -90 C 5 -110, 40 -95, 45 -65 C 50 -35, 25 -10, 0 0 Z" fill="url(#petalGrad)"/>
    </g>
    <g transform="rotate(216)">
      <path d="M 0 0 C -25 -20, -35 -60, -15 -90 C 5 -110, 40 -95, 45 -65 C 50 -35, 25 -10, 0 0 Z" fill="url(#petalGrad)"/>
    </g>
    <g transform="rotate(288)">
      <path d="M 0 0 C -25 -20, -35 -60, -15 -90 C 5 -110, 40 -95, 45 -65 C 50 -35, 25 -10, 0 0 Z" fill="url(#petalGrad)"/>
    </g>
    <!-- Golden yellow center spiral -->
    <circle cx="0" cy="0" r="28" fill="url(#flowerCenter)"/>
    <circle cx="0" cy="0" r="10" fill="#e68a00" opacity="0.6"/>
  </g>
</svg>
